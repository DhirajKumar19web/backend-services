version: '3.8'

services:
  course-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-course-service
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge
