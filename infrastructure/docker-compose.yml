services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lms-minio-prod
    restart: unless-stopped
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --address ":${MINIO_PORT}" --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - minio-data:/data

  minio-init:
    image: amazon/aws-cli:latest
    container_name: lms-minio-init-prod
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      for i in $$(seq 1 30); do
        aws --endpoint-url http://minio:${MINIO_PORT} s3 ls >/dev/null 2>&1 && break;
        sleep 2;
      done;
      aws --endpoint-url http://minio:${MINIO_PORT} s3 mb s3://${MINIO_BUCKET_NAME} 2>/dev/null || true;
      echo 'MinIO bucket ready: '${MINIO_BUCKET_NAME}
      "
  postgres:
    image: postgres:15-alpine
    container_name: lms-postgres-prod
    restart: unless-stopped
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: -p ${DB_PORT}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -p ${DB_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    container_name: lms-redis-prod
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: redis-server --port ${REDIS_PORT} --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: lms-rabbitmq-prod
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_UI_PORT}:${RABBITMQ_UI_PORT}"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_NODE_PORT: ${RABBITMQ_PORT}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management tcp_config [{port,${RABBITMQ_UI_PORT}}]"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
  redis-data:
  rabbitmq-data:
