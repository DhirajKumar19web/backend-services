x-node-service: &node-service
  restart: unless-stopped
  command: npm run dev
  networks:
    - lms-network

x-minio-client-env: &minio-client-env
  MINIO_ENDPOINT: minio
  MINIO_PORT: ${MINIO_PORT}
  MINIO_BUCKET: ${MINIO_BUCKET_NAME}

services:
  api-gateway:
    <<: *node-service
    build:
      context: ./api-gateway
      dockerfile: Dockerfile.dev
    container_name: lms-api-gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    env_file: .env
    volumes:
      - ./api-gateway/src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      course-service:
        condition: service_started
      notification-service:
        condition: service_started
      enrollment-service:
        condition: service_started
      payment-service:
        condition: service_started
      progress-service:
        condition: service_started
      assessment-service:
        condition: service_started
      certificate-service:
        condition: service_started

  auth-service:
    <<: *node-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    container_name: lms-auth-service
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${AUTH_SERVICE_PORT}
    volumes:
      - ./auth-service/src:/app/src

  notification-service:
    <<: *node-service
    build:
      context: ./notification-service
      dockerfile: Dockerfile.dev
    container_name: lms-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${NOTIFICATION_SERVICE_PORT}
    volumes:
      - ./notification-service/src:/app/src
    depends_on:
      rabbitmq:
        condition: service_healthy

  course-service:
    <<: *node-service
    build:
      context: ./course-service
      dockerfile: Dockerfile.dev
    container_name: lms-course-service
    ports:
      - "${COURSE_SERVICE_PORT}:${COURSE_SERVICE_PORT}"
    environment:
      <<: *minio-client-env
      NODE_ENV: ${NODE_ENV}
      PORT: ${COURSE_SERVICE_PORT}
    volumes:
      - ./course-service/src:/app/src
    depends_on:
      minio:
        condition: service_started

  user-service:
    <<: *node-service
    build:
      context: ./user-service
      dockerfile: Dockerfile.dev
    container_name: lms-user-service
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    environment:
      <<: *minio-client-env
      NODE_ENV: ${NODE_ENV}
      PORT: ${USER_SERVICE_PORT}
    volumes:
      - ./user-service/src:/app/src
    depends_on:
      minio:
        condition: service_started

  enrollment-service:
    <<: *node-service
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile.dev
    container_name: lms-enrollment-service
    ports:
      - "${ENROLLMENT_SERVICE_PORT}:${ENROLLMENT_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${ENROLLMENT_SERVICE_PORT}
    volumes:
      - ./enrollment-service/src:/app/src

  payment-service:
    <<: *node-service
    build:
      context: ./payment-service
      dockerfile: Dockerfile.dev
    container_name: lms-payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PAYMENT_SERVICE_PORT}
    volumes:
      - ./payment-service/src:/app/src

  progress-service:
    <<: *node-service
    build:
      context: ./progress-service
      dockerfile: Dockerfile.dev
    container_name: lms-progress-service
    ports:
      - "${PROGRESS_SERVICE_PORT}:${PROGRESS_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PROGRESS_SERVICE_PORT}
    volumes:
      - ./progress-service/src:/app/src

  assessment-service:
    <<: *node-service
    build:
      context: ./assessment-service
      dockerfile: Dockerfile.dev
    container_name: lms-assessment-service
    ports:
      - "${ASSESSMENT_SERVICE_PORT}:${ASSESSMENT_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${ASSESSMENT_SERVICE_PORT}
    volumes:
      - ./assessment-service/src:/app/src

  certificate-service:
    <<: *node-service
    build:
      context: ./certificate-service
      dockerfile: Dockerfile.dev
    container_name: lms-certificate-service
    ports:
      - "${CERTIFICATE_SERVICE_PORT}:${CERTIFICATE_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${CERTIFICATE_SERVICE_PORT}
    volumes:
      - ./certificate-service/src:/app/src

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lms-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --address ":${MINIO_PORT}" --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - minio-data:/data
    networks:
      - lms-network

  minio-init:
    image: amazon/aws-cli:latest
    container_name: lms-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        aws --endpoint-url http://minio:${MINIO_PORT} s3 ls >/dev/null 2>&1 && break;
        sleep 2;
      done;
      aws --endpoint-url http://minio:${MINIO_PORT} s3 mb s3://${MINIO_BUCKET_NAME} 2>/dev/null || true;
      echo 'MinIO bucket ready: '${MINIO_BUCKET_NAME}
      "
    networks:
      - lms-network

  postgres:
    image: postgres:15-alpine
    container_name: lms-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: -p ${DB_PORT}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -p ${DB_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network

  redis:
    image: redis:8-alpine
    container_name: lms-redis
    restart: unless-stopped
    command: redis-server --port ${REDIS_PORT} --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lms-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: lms-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_UI_PORT}:${RABBITMQ_UI_PORT}"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_NODE_PORT: ${RABBITMQ_PORT}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management tcp_config [{port,${RABBITMQ_UI_PORT}}]"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  redis-data:
  rabbitmq-data:
