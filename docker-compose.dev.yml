version: '3.8'

services:
  # ============================================================
  # MinIO Object Storage (Official Open-Source Standard Image)
  # ============================================================
  minio:
    # Docker Hub block ko bypass karne ke liye chainguard verified tag:
    image: cgr.dev/chainguard/minio:latest
    container_name: lms-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --address ":${MINIO_PORT}" --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - minio-data:/data
    networks:
      - lms-network

  # ============================================================
  # MinIO Bucket Initialization (Using Matching Official Client)
  # ============================================================
  minio-init:
    image: amazon/aws-cli:latest
    container_name: lms-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      sleep 5 &&
      aws --endpoint-url http://minio:${MINIO_PORT} s3 mb s3://${MINIO_BUCKET_NAME} || true &&
      echo 'MinIO bucket ready: '${MINIO_BUCKET_NAME}
      "
    networks:
      - lms-network

  # ============================================================
  # API Gateway
  # ============================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile.dev
    container_name: lms-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      GATEWAY_HOST: ${GATEWAY_HOST}
      GATEWAY_PORT: ${GATEWAY_PORT}
      JWT_SECRET: ${JWT_SECRET}
      API_PREFIX: ${API_PREFIX}
      API_VERSION: ${API_VERSION}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_ROUTE_PREFIX: ${AUTH_ROUTE_PREFIX}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      USER_ROUTE_PREFIX: ${USER_ROUTE_PREFIX}
      COURSE_SERVICE_URL: ${COURSE_SERVICE_URL}
      COURSE_ROUTE_PREFIX: ${COURSE_ROUTE_PREFIX}
    volumes:
      - ./api-gateway/src:/app/src
    command: npm run dev
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - lms-network

  # ============================================================
  # Auth Service
  # ============================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    container_name: lms-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${AUTH_SERVICE_PORT}
    volumes:
      - ./auth-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  # ============================================================
  # Notification Service
  # ============================================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile.dev
    container_name: lms-notification-service
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${NOTIFICATION_SERVICE_PORT}
    volumes:
      - ./notification-service/src:/app/src
    command: npm run dev
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - lms-network

  # ============================================================
  # Course Service
  # ============================================================
  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile.dev
    container_name: lms-course-service
    restart: unless-stopped
    ports:
      - "${COURSE_SERVICE_PORT}:${COURSE_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${COURSE_SERVICE_PORT}
      MINIO_ENDPOINT: minio
      MINIO_PORT: ${MINIO_PORT}
      MINIO_BUCKET: ${MINIO_BUCKET_NAME}
    volumes:
      - ./course-service/src:/app/src
    command: npm run dev
    depends_on:
      minio:
        condition: service_started
    networks:
      - lms-network

  # ============================================================
  # User Service
  # ============================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile.dev
    container_name: lms-user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${USER_SERVICE_PORT}
      MINIO_ENDPOINT: minio
      MINIO_PORT: ${MINIO_PORT}
      MINIO_BUCKET: ${MINIO_BUCKET_NAME}
    volumes:
      - ./user-service/src:/app/src
    command: npm run dev
    depends_on:
      minio:
        condition: service_started
    networks:
      - lms-network

  # ============================================================
  # Enrollment Service
  # ============================================================
  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile.dev
    container_name: lms-enrollment-service
    restart: unless-stopped
    ports:
      - "${ENROLLMENT_SERVICE_PORT}:${ENROLLMENT_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${ENROLLMENT_SERVICE_PORT}
    volumes:
      - ./enrollment-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  # ============================================================
  # Payment Service
  # ============================================================
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile.dev
    container_name: lms-payment-service
    restart: unless-stopped
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PAYMENT_SERVICE_PORT}
    volumes:
      - ./payment-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  # ============================================================
  # Progress Service
  # ============================================================
  progress-service:
    build:
      context: ./progress-service
      dockerfile: Dockerfile.dev
    container_name: lms-progress-service
    restart: unless-stopped
    ports:
      - "${PROGRESS_SERVICE_PORT}:${PROGRESS_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PROGRESS_SERVICE_PORT}
    volumes:
      - ./progress-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  # ============================================================
  # Assessment Service
  # ============================================================
  assessment-service:
    build:
      context: ./assessment-service
      dockerfile: Dockerfile.dev
    container_name: lms-assessment-service
    restart: unless-stopped
    ports:
      - "${ASSESSMENT_SERVICE_PORT}:${ASSESSMENT_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${ASSESSMENT_SERVICE_PORT}
    volumes:
      - ./assessment-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  # ============================================================
  # Certificate Service
  # ============================================================
  certificate-service:
    build:
      context: ./certificate-service
      dockerfile: Dockerfile.dev
    container_name: lms-certificate-service
    restart: unless-stopped
    ports:
      - "${CERTIFICATE_SERVICE_PORT}:${CERTIFICATE_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${CERTIFICATE_SERVICE_PORT}
    volumes:
      - ./certificate-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: lms-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: -p ${DB_PORT}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis Cache & Rate Limiting (Official Standard Stable Tag)
  # ============================================================
  redis:
    image: redis:alpine
    container_name: lms-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --port
      - ${REDIS_PORT}
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lms-network

  # ============================================================
  # RabbitMQ Message Broker (Standard Alpine)
  # ============================================================
  rabbitmq:
    image: rabbitmq:alpine
    container_name: lms-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_UI_PORT}:${RABBITMQ_UI_PORT}"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_NODE_PORT: ${RABBITMQ_PORT}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management listener [{port,${RABBITMQ_UI_PORT}}]"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lms-network

# ============================================================
# Networks & Volumes Definitions
# ============================================================
networks:
  lms-network:
    driver: bridge

volumes:
  minio-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
