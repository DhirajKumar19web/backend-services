services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile.dev
    container_name: lms-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      GATEWAY_HOST: ${GATEWAY_HOST}
      GATEWAY_PORT: ${GATEWAY_PORT}
      JWT_SECRET: ${JWT_SECRET}
      API_PREFIX: ${API_PREFIX}
      API_VERSION: ${API_VERSION}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_ROUTE_PREFIX: ${AUTH_ROUTE_PREFIX}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      USER_ROUTE_PREFIX: ${USER_ROUTE_PREFIX}
      COURSE_SERVICE_URL: ${COURSE_SERVICE_URL}
      COURSE_ROUTE_PREFIX: ${COURSE_ROUTE_PREFIX}
    volumes:
      - ./api-gateway/src:/app/src
    command: npm run dev
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - lms-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    container_name: lms-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${AUTH_SERVICE_PORT}
    volumes:
      - ./auth-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile.dev
    container_name: lms-notification-service
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${NOTIFICATION_SERVICE_PORT}
    volumes:
      - ./notification-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile.dev
    container_name: lms-course-service
    restart: unless-stopped
    ports:
      - "${COURSE_SERVICE_PORT}:${COURSE_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${COURSE_SERVICE_PORT}
    volumes:
      - ./course-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile.dev
    container_name: lms-user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${USER_SERVICE_PORT}
    volumes:
      - ./user-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile.dev
    container_name: lms-enrollment-service
    restart: unless-stopped
    ports:
      - "${ENROLLMENT_SERVICE_PORT}:${ENROLLMENT_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${ENROLLMENT_SERVICE_PORT}
    volumes:
      - ./enrollment-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile.dev
    container_name: lms-payment-service
    restart: unless-stopped
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PAYMENT_SERVICE_PORT}
    volumes:
      - ./payment-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  progress-service:
    build:
      context: ./progress-service
      dockerfile: Dockerfile.dev
    container_name: lms-progress-service
    restart: unless-stopped
    ports:
      - "${PROGRESS_SERVICE_PORT}:${PROGRESS_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PROGRESS_SERVICE_PORT}
    volumes:
      - ./progress-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  assessment-service:
    build:
      context: ./assessment-service
      dockerfile: Dockerfile.dev
    container_name: lms-assessment-service
    restart: unless-stopped
    ports:
      - "${ASSESSMENT_SERVICE_PORT}:${ASSESSMENT_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${ASSESSMENT_SERVICE_PORT}
    volumes:
      - ./assessment-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  certificate-service:
    build:
      context: ./certificate-service
      dockerfile: Dockerfile.dev
    container_name: lms-certificate-service
    restart: unless-stopped
    ports:
      - "${CERTIFICATE_SERVICE_PORT}:${CERTIFICATE_SERVICE_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${CERTIFICATE_SERVICE_PORT}
    volumes:
      - ./certificate-service/src:/app/src
    command: npm run dev
    networks:
      - lms-network

  redis:
    image: redis:8-alpine
    container_name: lms-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lms-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lms-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge

volumes:
  redis-data:
  rabbitmq-data:
