services:

  gateway:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: lms-api-gateway

    restart: unless-stopped

    ports:
      - "4000:4000"

    environment:
      NODE_ENV: production

      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 4000

      JWT_SECRET: ${JWT_SECRET}

      API_PREFIX: ${API_PREFIX}
      API_VERSION: ${API_VERSION}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_ROUTE_PREFIX: ${AUTH_ROUTE_PREFIX}

      USER_SERVICE_URL: ${USER_SERVICE_URL}
      USER_ROUTE_PREFIX: ${USER_ROUTE_PREFIX}

      COURSE_SERVICE_URL: ${COURSE_SERVICE_URL}
      COURSE_ROUTE_PREFIX: ${COURSE_ROUTE_PREFIX}

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - lms-network


  redis:
    image: redis:8-alpine

    container_name: lms-redis

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - lms-network


networks:

  lms-network:
    driver: bridge


volumes:

  redis-data: